name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is taken from package.json's "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed build-time .env from .env.example
        run: cp .env.example .env

      - name: Build project
        run: pnpm build
        env:
          PUBLIC_SITE_URL: https://ecohubs.community

      # Nothing was serving :4173, so every run since May died with
      # CHROME_INTERSTITIAL_ERROR before auditing anything.
      #
      # `treosh/lighthouse-ci-action` has no `startServerCommand` input — that
      # belongs to @lhci/cli's config file, and passing it here is silently
      # ignored with a warning. So the server is started as its own step and
      # polled until it answers.
      - name: Start preview server
        run: |
          pnpm preview --port 4173 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              echo "preview is up"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not come up within 60s:"
          cat /tmp/preview.log
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/vision
            http://localhost:4173/rcos
            http://localhost:4173/membership
            http://localhost:4173/faq
            http://localhost:4173/join
            http://localhost:4173/contact
            http://localhost:4173/blog
            http://localhost:4173/learn
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
